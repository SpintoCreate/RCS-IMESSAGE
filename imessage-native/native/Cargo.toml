[package]
name = "unified-imessage-native"
version = "0.1.0"
edition = "2021"

[lib]
name = "unified_imessage_native"
crate-type = ["cdylib"]

[dependencies]
jni = "0.21.1"
rustpush = { path = "../build/rustpush", default-features = false, features = ["remote-anisette-v3"] }
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
url = "2"
